name: 跟踪 cfnew core-only 内核

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

env:
  CF_ACCOUNT_ID: "8bae7063eecf057ed2c497b9bedd3bd7"
  KV_NAMESPACE_ID: "28f1800d6c394c33ac0bddf15a54445e"
  WORKER_NAME: "cfnew-core"
  WORKER_HOST: "zmq.kdns.fr"
  COMPAT_DATE: "2026-01-20"

jobs:
  sync-core:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取上游 core-only 最新提交
        id: up
        run: |
          SHA=$(git ls-remote https://github.com/byJoey/cfnew.git refs/heads/core-only | cut -f1)
          DATE=$(curl -s "https://api.github.com/repos/byJoey/cfnew/commits/$SHA" | jq -r '.commit.committer.date')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "上游 core-only HEAD: $SHA ($DATE)"

      - name: 下载内核并与当前比对
        id: cmp
        run: |
          set -e
          curl -sSL --fail -o _worker.js.new \
            "https://raw.githubusercontent.com/byJoey/cfnew/core-only/_worker.js"
          if [ ! -s _worker.js.new ]; then
            echo "::error::内核下载为空，中止（避免用空文件覆盖线上）"
            exit 1
          fi
          OLD=$(sha256sum _worker.js | cut -d' ' -f1)
          NEW=$(sha256sum _worker.js.new | cut -d' ' -f1)
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "内核无变化"
            rm -f _worker.js.new
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "内核有更新：$OLD -> $NEW"
            mv _worker.js.new _worker.js
          fi

      - name: 更新版本记录
        if: steps.cmp.outputs.changed == 'true'
        run: |
          printf '%s\n%s\n' "${{ steps.up.outputs.sha }}" "${{ steps.up.outputs.date }}" > VERSION.txt
          cat VERSION.txt

      - name: 提交并推送（GitHub 侧存档）
        if: steps.cmp.outputs.changed == 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add _worker.js VERSION.txt
          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "自动同步: cfnew core-only ${{ steps.up.outputs.sha }}"
            git push
            echo "已提交并推送更新"
          fi

      - name: 部署到 Cloudflare Worker
        if: steps.cmp.outputs.changed == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WORKER_UUID: ${{ secrets.CF_WORKER_UUID }}
        run: |
          set -e
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::未配置 CF_API_TOKEN，跳过 Worker 部署（仅完成 GitHub 侧存档）"
            exit 0
          fi
          HTTP=$(curl -sS --fail-with-body -o deploy.json -w "%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -F "metadata={\"main_module\":\"_worker.js\",\"compatibility_date\":\"${COMPAT_DATE}\",\"bindings\":[{\"type\":\"kv_namespace\",\"name\":\"c\",\"namespace_id\":\"${KV_NAMESPACE_ID}\"},{\"type\":\"plain_text\",\"name\":\"u\",\"text\":\"${WORKER_UUID}\"}]};type=application/json" \
            -F "_worker.js=@_worker.js;type=application/javascript+module")
          echo "Cloudflare 返回 HTTP $HTTP"
          cat deploy.json
          if [ "$HTTP" != "200" ]; then
            echo "::error::Worker 部署失败"
            exit 1
          fi

      - name: 部署后验证
        if: steps.cmp.outputs.changed == 'true'
        env:
          WORKER_UUID: ${{ secrets.CF_WORKER_UUID }}
        run: |
          set -e
          sleep 5
          ROOT=$(curl -sS "https://${WORKER_HOST}/")
          echo "Worker 首页: $ROOT"
          [ "$ROOT" = "hello" ] || { echo "::error::首页返回异常"; exit 1; }
          CFG=$(curl -sS "https://${WORKER_HOST}/${WORKER_UUID}/api/config")
          echo "$CFG" | head -c 400
          echo ""
          echo "$CFG" | jq -e '.coreVersion and .kvEnabled == true' > /dev/null \
            || { echo "::error::配置接口校验失败"; exit 1; }
          echo "✅ 部署验证通过"

      - name: 输出摘要
        run: |
          {
            echo "## core-only 同步结果"
            echo "- 上游提交: \`${{ steps.up.outputs.sha }}\`"
            echo "- 是否更新: \`${{ steps.cmp.outputs.changed }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
